name: Validate implementation plan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate plan and coordination logic
        run: |
          python3 scripts/check_plan.py
          python3 -m unittest discover -s tests/coordination -p 'test_*.py'
          git diff --check

  native-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.9.0'
      - name: Install pinned workspace
        run: npm exec --yes --package=pnpm@11.28.5 -- pnpm install --frozen-lockfile
      - name: Verify native bundle
        run: npm exec --yes --package=pnpm@11.28.5 -- pnpm check
